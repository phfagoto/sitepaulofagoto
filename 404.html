<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Paulo Fagoto</title>
  <meta name="robots" content="noindex" /> <!-- Impede o Google de indexar a página de erro -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="estilo.css" />

  <!-- Estilo exclusivo para o botão de voltar ao início -->
  <style>
    .btn-home {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ink);
    }
    .btn-home::before {
      background: var(--accent-soft);
    }
    .btn-home:hover, .btn-home:focus-visible {
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 14px 40px rgba(56, 189, 248, 0.35);
    }
    .btn-home:hover svg {
      transform: translateX(-4px); /* Efeito de mover a setinha para a esquerda */
    }
    .error-message {
      font-family: var(--sans);
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }
  </style>
</head>
<body>

  <!-- O script vai colocar o Menu aqui automaticamente -->
  <header id="global-header"></header>

  <div class="spotlight" id="spotlight" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="stage" role="main">
    <article class="panel">

      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>

      <h1 class="name">Erro <em>404</em></h1>

      <div class="ornament" aria-hidden="true">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>

      <p class="role"><strong>Página não encontrada</strong></p>
      
      <p class="error-message">
        A página que você está procurando não existe, foi removida ou o endereço foi digitado incorretamente.
      </p>

      <div class="cta">
        <a href="index.html" class="btn btn-home" aria-label="Voltar para a página inicial">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          <span>Voltar para o Início</span>
        </a>
      </div>

    </article>
  </main>

  <!-- O script vai colocar o Rodapé aqui automaticamente -->
  <footer id="global-footer"></footer>

  <!-- JS externo -->
  <script src="script.js" defer></script>

</body>
</html>

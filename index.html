<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paulo Fagoto | Técnico em Informática</title>
  <meta name="description" content="Paulo Fagoto — Técnico em Informática." />
  <link rel="canonical" href="https://www.paulofagoto.com.br/" />

  <meta property="og:title" content="Paulo Fagoto | Técnico em Informática" />
  <meta property="og:description" content="Paulo Fagoto — Técnico em Informática." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.paulofagoto.com.br/" />
  <meta property="og:image" content="https://www.paulofagoto.com.br/paulofagoto.webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #0a0a0b;
      --ink-2: #121215;
      --ink-3: #1a1a1f;
      --gold: #c9a961;
      --gold-soft: #e2c98a;
      --gold-dim: rgba(201, 169, 97, 0.35);
      --bone: #f5f2ec;
      --muted: #8a8a92;
      --line: rgba(245, 242, 236, 0.09);
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--ink);
      color: var(--bone);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 100;
      mix-blend-mode: overlay;
    }

    .spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        620px circle at var(--mx, 50%) var(--my, 40%),
        rgba(201, 169, 97, 0.10),
        transparent 55%
      );
      transition: background 0.25s ease;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,0.55) 100%);
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
      background-size: 25% 100%;
      opacity: 0.5;
      mask-image: radial-gradient(ellipse at 50% 45%, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 20%, transparent 80%);
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      box-shadow: 0 0 6px var(--gold);
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-100vh) scale(1); }
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      animation: stageIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes stageIn {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel {
      position: relative;
      padding: 72px 56px 64px;
      background: linear-gradient(180deg, rgba(26, 26, 31, 0.72) 0%, rgba(18, 18, 21, 0.92) 100%);
      border: 1px solid var(--line);
      border-radius: 2px;
      text-align: center;
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(245, 242, 236, 0.06);
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
      animation: lineShift 6s ease-in-out infinite;
    }

    @keyframes lineShift {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 1px solid var(--gold-dim);
      pointer-events: none;
    }
    .corner.tl { top: 14px;    left: 14px;    border-right: none; border-bottom: none; }
    .corner.tr { top: 14px;    right: 14px;   border-left: none;  border-bottom: none; }
    .corner.bl { bottom: 14px; left: 14px;    border-right: none; border-top: none; }
    .corner.br { bottom: 14px; right: 14px;   border-left: none;  border-top: none; }

    /* ===== FOTO ===== */
    .photo {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto 34px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      animation: floatSlow 7s ease-in-out infinite;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(201, 169, 97, 0.25),
        0 0 40px rgba(201, 169, 97, 0.12);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      /* Ajuste do enquadramento: foco no terço superior para não cortar o topo da cabeça */
      object-position: center 30%;
      filter: contrast(1.03) saturate(0.98);
      background: var(--ink-3);
    }

    .photo::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid var(--gold-dim);
      opacity: 0.7;
      pointer-events: none;
    }

    .photo::after {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px dashed rgba(201, 169, 97, 0.18);
      animation: rotate 30s linear infinite;
      pointer-events: none;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    /* ===== TIPOGRAFIA ===== */
    .name {
      font-family: var(--serif);
      font-size: clamp(2.6rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.01em;
      color: var(--bone);
      margin-bottom: 18px;
      opacity: 0;
      animation: revealText 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    .name em { font-style: italic; color: var(--gold-soft); }

    @keyframes revealText {
      from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 8px auto 20px;
      opacity: 0;
      animation: revealText 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .ornament .line {
      height: 1px;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--gold-dim));
    }
    .ornament .line:last-child {
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    .ornament .diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--gold-dim);
    }

    .role {
      font-family: var(--sans);
      font-size: clamp(0.82rem, 2vw, 0.92rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 44px;
      opacity: 0;
      animation: revealText 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .role strong { color: var(--bone); font-weight: 500; }

    .cta {
      opacity: 0;
      animation: revealText 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 40px;
      min-width: 280px;
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 1px;
      cursor: pointer;
      overflow: hidden;
      transition:
        background 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.3s ease,
        box-shadow 0.4s ease;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.15) inset,
        0 10px 30px rgba(201, 169, 97, 0.18);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 2;
    }

    .btn span { position: relative; z-index: 2; }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--ink-2);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .btn:hover,
    .btn:focus-visible {
      color: var(--gold-soft);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.05) inset,
        0 14px 40px rgba(201, 169, 97, 0.28);
      outline: none;
    }

    .btn:hover::before,
    .btn:focus-visible::before { transform: scaleY(1); }

    .btn:hover svg { transform: translateX(3px) scale(1.05); }
    .btn:active { transform: translateY(1px); }

    @media (max-width: 520px) {
      .panel { padding: 56px 28px 48px; }
      .role { letter-spacing: 0.2em; margin-bottom: 36px; }
      .btn { min-width: 0; width: 100%; padding: 16px 24px; letter-spacing: 0.16em; }
      .corner { width: 14px; height: 14px; }
      .corner.tl, .corner.tr { top: 10px; }
      .corner.bl, .corner.br { bottom: 10px; }
      .corner.tl, .corner.bl { left: 10px; }
      .corner.tr, .corner.br { right: 10px; }
      .photo { width: 112px; height: 112px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .name, .ornament, .role, .cta {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="spotlight" id="spotlight" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="stage" role="main">
    <article class="panel">

      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>

      <div class="photo">
        <img
          src="/paulofagoto.webp"
          alt="Paulo Fagoto — Técnico em Informática"
          width="132"
          height="132"
          loading="eager"
          decoding="async"
        />
      </div>

      <h1 class="name">Paulo <em>Fagoto</em></h1>

      <div class="ornament" aria-hidden="true">
        <span class="line"></span>
        <span class="diamond"></span>
        <span class="line"></span>
      </div>

      <p class="role"><strong>Técnico em Informática</strong></p>

      <div class="cta">
        <a
          class="btn"
          id="btnWhatsapp"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Entrar em contato com Paulo Fagoto pelo WhatsApp"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <span>WhatsApp</span>
        </a>
      </div>

    </article>
  </main>

  <script>
    (function () {
      'use strict';

      var TELEFONE = '5519971540808';
      var MENSAGEM = 'Olá Paulo, vim pelo site e preciso do ser serviço como técnico em informática.';
      var btn = document.getElementById('btnWhatsapp');
      if (btn) {
        btn.href = 'https://wa.me/' + TELEFONE + '?text=' + encodeURIComponent(MENSAGEM);
      }

      var spotlight = document.getElementById('spotlight');
      if (spotlight && window.matchMedia('(pointer: fine)').matches) {
        var mx = 50, my = 40, cx = 50, cy = 40;
        window.addEventListener('pointermove', function (e) {
          mx = (e.clientX / window.innerWidth) * 100;
          my = (e.clientY / window.innerHeight) * 100;
        }, { passive: true });
        (function animate() {
          cx += (mx - cx) * 0.08;
          cy += (my - cy) * 0.08;
          spotlight.style.setProperty('--mx', cx + '%');
          spotlight.style.setProperty('--my', cy + '%');
          requestAnimationFrame(animate);
        })();
      }

      var particlesBox = document.getElementById('particles');
      if (particlesBox && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var total = window.innerWidth < 640 ? 12 : 22;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < total; i++) {
          var p = document.createElement('span');
          p.className = 'particle';
          p.style.left = Math.random() * 100 + '%';
          p.style.top = (100 + Math.random() * 20) + '%';
          var dur = 14 + Math.random() * 18;
          p.style.animationDuration = dur + 's';
          p.style.animationDelay = (-Math.random() * dur) + 's';
          var scale = 0.5 + Math.random() * 1.2;
          p.style.transform = 'scale(' + scale + ')';
          frag.appendChild(p);
        }
        particlesBox.appendChild(frag);
      }

      var panel = document.querySelector('.panel');
      if (panel && window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var rafId = null;
        window.addEventListener('pointermove', function (e) {
          if (rafId) return;
          rafId = requestAnimationFrame(function () {
            var rect = panel.getBoundingClientRect();
            var px = (e.clientX - rect.left) / rect.width - 0.5;
            var py = (e.clientY - rect.top) / rect.height - 0.5;
            var rx = (-py * 3).toFixed(2);
            var ry = (px * 3).toFixed(2);
            panel.style.transform = 'perspective(1200px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
            rafId = null;
          });
        }, { passive: true });
        document.addEventListener('pointerleave', function () {
          panel.style.transform = '';
        });
      }
    })();
  </script>

</body>
</html>
